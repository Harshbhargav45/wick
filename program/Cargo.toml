[package]
name = "wick-guard"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.89.0"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
pinocchio = { version = "0.10", features = ["alloc", "cpi", "copy"] }
pinocchio-log = "0.5.1"
pinocchio-system = { version = "0.5" }
ephemeral-rollups-pinocchio = "0.16.2"

[features]
no-entrypoint = []

[dev-dependencies]
flate2 = "1"
litesvm = "0.15.2"
solana-address = "~2.6.1"
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-instruction = "3.4.0"
solana-transaction = "4.1.5"
solana-signer = "3.0.1"
solana-native-token = "3.0.0"
solana-system-interface = "3.2.0"
solana-signature = "~3.4.1"
solana-hash = "~4.5.0"
solana-account = "4.3.0"
solana-pubkey = "4.2.0"
solana-transaction-error = "~3.3.1"
proptest = "1.11.0"
sha2 = "0.10"
bs58 = "0.5"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(solana)'] }

[profile.release]
overflow-checks = true
lto = "thin"
incremental = false
codegen-units = 1
